<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DARE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="overlay">

        <div id="dareCard" class="dare-card">

            <div class="header">
                <span class="badge">DARE</span>
                <span id="status" class="status">OFFLINE</span>
            </div>

            <div class="content">

                <div id="username" class="username">
                    @username
                </div>

                <div id="dareText" class="dare-text">
                    Waiting for a dare...
                </div>

            </div>

        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
